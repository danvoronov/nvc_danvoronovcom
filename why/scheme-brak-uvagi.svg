<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-label="Схема: одна ситуація — два шляхи">
  <defs>
    <!-- Arrow markers: centered and oriented -->
    <marker id="arr-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#4f8ecc"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#38a872"/>
    </marker>

    <!-- Subtle card depth -->
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.025"/>
    </filter>
  </defs>

  <style>
    .card-top { fill: #ffffff; stroke: #e5e2db; stroke-width: 1.4; rx: 16px; filter: url(#card-shadow); }
    
    .card-neutral { fill: #f6faff; stroke: #dbe8f6; stroke-width: 1.2; rx: 14px; filter: url(#card-shadow); }
    .card-warn { fill: #f6faff; stroke: #dbe8f6; stroke-width: 1.2; rx: 14px; filter: url(#card-shadow); }
    .card-danger { fill: #eef6ff; stroke: #c4defa; stroke-width: 1.4; rx: 14px; filter: url(#card-shadow); }
    
    .card-good { fill: #f5fbf7; stroke: #d2f0df; stroke-width: 1.2; rx: 14px; filter: url(#card-shadow); }
    .card-success { fill: #ebf9f0; stroke: #b6edd0; stroke-width: 1.4; rx: 14px; filter: url(#card-shadow); }

    .title-top { font: 700 15px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #1f2937; }
    .sub-top { font: 400 12px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #6b7280; }

    .title-node { font: 600 14px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #1f2937; }
    .sub-node { font: 400 11.5px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #6b7280; }
    
    .title-danger { font: 700 14.5px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #dc2626; }
    .title-success { font: 700 14.5px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #16a34a; }

    .badge-pill-left { fill: #4f8ecc; rx: 10px; }
    .badge-pill-right { fill: #38a872; rx: 10px; }
    .badge-text { font: 700 10px/1 Inter, -apple-system, sans-serif; fill: #ffffff; letter-spacing: 0.6px; }

    .path-branch-left { stroke: #4f8ecc; stroke-width: 1.6; fill: none; stroke-linecap: round; marker-end: url(#arr-blue); }
    .path-branch-right { stroke: #38a872; stroke-width: 1.6; fill: none; stroke-linecap: round; marker-end: url(#arr-green); }
    
    .path-step-left { stroke: #4f8ecc; stroke-width: 1.3; fill: none; stroke-linecap: round; marker-end: url(#arr-blue); }
    .path-step-right { stroke: #38a872; stroke-width: 1.3; fill: none; stroke-linecap: round; marker-end: url(#arr-green); }

    .divider { stroke: #f0ece6; stroke-width: 1; stroke-dasharray: 6 6; }
  </style>

  <!-- Center subtle divider -->
  <line class="divider" x1="450" y1="110" x2="450" y2="430"/>

  <!-- ================= TOP: SINGLE TRIGGER ================= -->
  <!-- Top bubble: width 320, centered at 450 -> x = 290, y = 16, height = 66, center y = 49 -->
  <g transform="translate(290, 16)">
    <rect class="card-top" width="320" height="66"/>
    <text class="title-top" x="160" y="29" text-anchor="middle">Побутовий епізод</text>
    <text class="sub-top" x="160" y="50" text-anchor="middle">втома · немитий посуд · тригер</text>
  </g>

  <!-- Branch arrows EXITING FROM SIDES of top bubble -->
  <!-- Left start: (290, 49) -> Curves left and down into center of left track (200, 134) -->
  <path class="path-branch-left" d="M 290 49 C 200 49, 200 80, 200 128"/>
  <!-- Right start: (610, 49) -> Curves right and down into center of right track (700, 134) -->
  <path class="path-branch-right" d="M 610 49 C 700 49, 700 80, 700 128"/>

  <!-- Badges floating ON/ABOVE the branch shoulders -->
  <g transform="translate(135, 38)">
    <rect class="badge-pill-left" width="130" height="22"/>
    <text class="badge-text" x="65" y="14.5" text-anchor="middle">БЕЗ ЕМПАТІЇ</text>
  </g>

  <g transform="translate(635, 38)">
    <rect class="badge-pill-right" width="130" height="22"/>
    <text class="badge-text" x="65" y="14.5" text-anchor="middle">З ЕМПАТІЄЮ</text>
  </g>

  <!-- ================= LEFT TRACK: БЕЗ ЕМПАТІЇ (Center x = 200, Card width = 320, x = 40) ================= -->
  <!-- Step 1 (y: 134) -->
  <g transform="translate(40, 134)">
    <rect class="card-warn" width="320" height="56"/>
    <text class="title-node" x="160" y="24" text-anchor="middle">Знецінення</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">«знову не так» · швидкий ярлик</text>
  </g>
  <path class="path-step-left" d="M 200 190 L 200 210"/>

  <!-- Step 2 (y: 214) -->
  <g transform="translate(40, 214)">
    <rect class="card-neutral" width="320" height="56"/>
    <text class="title-node" x="160" y="24" text-anchor="middle">Накопичення</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">образи · приховані здогадки</text>
  </g>
  <path class="path-step-left" d="M 200 270 L 200 290"/>

  <!-- Step 3 (y: 294) -->
  <g transform="translate(40, 294)">
    <rect class="card-neutral" width="320" height="56"/>
    <text class="title-node" x="160" y="24" text-anchor="middle">Дистанція</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">глухий захист · «так сталося»</text>
  </g>
  <path class="path-step-left" d="M 200 350 L 200 370"/>

  <!-- Step 4 Outcome (y: 374) -->
  <g transform="translate(40, 374)">
    <rect class="card-danger" width="320" height="56"/>
    <text class="title-danger" x="160" y="24" text-anchor="middle">Розрив</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">втрата довіри та живого контакту</text>
  </g>

  <!-- ================= RIGHT TRACK: З ЕМПАТІЄЮ (Center x = 700, Card width = 320, x = 540) ================= -->
  <!-- Step 1 (y: 134) -->
  <g transform="translate(540, 134)">
    <rect class="card-good" width="320" height="56"/>
    <text class="title-node" x="160" y="24" text-anchor="middle">Пауза + цікавість</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">«що насправді з тобою зараз?»</text>
  </g>
  <path class="path-step-right" d="M 700 190 L 700 210"/>

  <!-- Step 2 (y: 214) -->
  <g transform="translate(540, 214)">
    <rect class="card-good" width="320" height="56"/>
    <text class="title-node" x="160" y="24" text-anchor="middle">Визнання потреб</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">почуто обох без критики й оцінок</text>
  </g>
  <path class="path-step-right" d="M 700 270 L 700 290"/>

  <!-- Step 3 (y: 294) -->
  <g transform="translate(540, 294)">
    <rect class="card-good" width="320" height="56"/>
    <text class="title-node" x="160" y="24" text-anchor="middle">Відкритий діалог</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">безпечний простір для вразливого</text>
  </g>
  <path class="path-step-right" d="M 700 350 L 700 370"/>

  <!-- Step 4 Outcome (y: 374) -->
  <g transform="translate(540, 374)">
    <rect class="card-success" width="320" height="56"/>
    <text class="title-success" x="160" y="24" text-anchor="middle">Відновлення контакту</text>
    <text class="sub-node" x="160" y="42" text-anchor="middle">довіра і взаємна підтримка</text>
  </g>
</svg>