<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Потреби · Почуття · Дії</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --bg-elevated: #ffffff;
  --text: #1a1d23;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --border-soft: #eef0f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 16px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 8px 32px rgba(16, 24, 40, 0.08);
  --font: "DM Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}

/* ---------- SINGLE LIGHTBOX OVERLAY ---------- */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(15, 23, 42, 0.42);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 36px 20px;
  overflow-y: auto;
  align-items: flex-start;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}

.modal.active {
  display: flex;
}

.modal-card {
  position: relative;
  background: transparent;
  width: 100%;
  max-width: 1320px;
  border-radius: 0;
  border: none;
  outline: none;
  box-shadow: none;
  margin: auto 0;
  animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalScale {
  from { opacity: 0; transform: scale(0.96) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1050;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  outline: none;
  background: rgba(0, 0, 0, 0.35);
  color: #ffffff;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.18s ease;
}

.modal-close:hover {
  background: rgba(0, 0, 0, 0.6);
  color: #ffffff;
  transform: scale(1.1);
}

.modal-body {
  padding: 0;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- HOME ---------- */

.home-wrap {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 40px;
  padding: 40px 24px;
  background: #e5e7eb;
}

.home-circumstances-label {
  position: absolute;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: clamp(12px, 1.3vw, 15px);
  font-family: var(--mono);
  color: #6b7280;
  pointer-events: none;
  z-index: 1;
}

.rings {
  /* 3 flush bands: actions | feelings | needs */
  --band: 16.5%;
  position: relative;
  width: min(720px, 78vh, 88vw);
  height: min(720px, 78vh, 88vw);
  z-index: 2;
}

.ring {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  transition: filter 0.2s ease, transform 0.2s ease;
}

.ring:hover {
  filter: brightness(1.04);
}

/* Outer → inner: true donut ring bands with radial masks */
.ring-actions {
  inset: 0;
  background: #f59e0b;
  box-shadow: var(--shadow-lg);
  clip-path: circle(50%);
  -webkit-clip-path: circle(50%);
  mask-image: radial-gradient(circle, transparent 33%, black 33.5%);
  -webkit-mask-image: radial-gradient(circle, transparent 33%, black 33.5%);
}

.ring-feelings {
  inset: var(--band);
  background: #22c55e;
  clip-path: circle(50%);
  -webkit-clip-path: circle(50%);
  mask-image: radial-gradient(circle, transparent 25%, black 25.5%);
  -webkit-mask-image: radial-gradient(circle, transparent 25%, black 25.5%);
}

.ring-needs {
  inset: calc(var(--band) * 2);
  background: linear-gradient(145deg, #60a5fa, #2563eb);
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: circle(50%);
  -webkit-clip-path: circle(50%);
}

.ring-label {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: auto;
  z-index: 5;
  font-size: clamp(12px, 1.4vw, 16px);
  font-family: var(--mono);
  white-space: nowrap;
  text-align: center;
}

.ring-label.actions {
  top: calc(var(--band) * 0.5 - 0.65em);
  color: #78350f;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.2;
}

.ring-label.feelings {
  top: calc(var(--band) * 1.5 - 0.65em);
  color: #14532d;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.2;
}

.ring-sub {
  font-size: clamp(9.5px, 1.1vw, 12px);
  font-weight: 400;
  letter-spacing: 0.02em;
  opacity: 0.85;
  text-transform: none;
  margin-top: 1px;
}

.ring-needs-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  line-height: 1.25;
  padding: 6px;
  pointer-events: auto;
  cursor: pointer;
}

.ring-main.needs {
  font-size: clamp(13px, 1.6vw, 19px);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.ring-sub.needs {
  font-size: clamp(10.5px, 1.2vw, 14px);
  font-weight: 400;
  opacity: 0.88;
  letter-spacing: 0.03em;
  margin-top: 2px;
  text-transform: none;
}

/* ---------- SCHEMA SHARED ---------- */

.schema-wrap {
  background: var(--bg-elevated);
  border: none;
  outline: none;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
}

.schema-word {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  line-height: 1.35;
  padding: 1px 0;
  opacity: 0.92;
}

.schema-word.em {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  opacity: 1;
}

.schema-word.sub {
  font-weight: 400;
  font-size: 11.5px;
  opacity: 0.82;
  font-style: italic;
}

/* ---------- NEEDS SCHEMA ---------- */

.needs-schema {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-template-rows: auto auto auto auto auto;
  gap: 1px;
  background: var(--border);
}

.needs-schema > * {
  background: #fff;
  padding: 12px 10px;
  min-height: 0;
}

/* Top spiritual bar */
.n-top {
  grid-column: 1 / -1;
  background: linear-gradient(90deg, #f3e8ff, #e9d5ff, #f3e8ff) !important;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  align-items: center;
  gap: 8px 16px;
  padding: 14px 16px !important;
}

.n-top .schema-word {
  color: #5b21b6;
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Upper 5 cells */
.n-u1 { grid-column: 1 / 3; background: #fde68a !important; color: #78350f; }
.n-u2 { grid-column: 3 / 5; background: #fef08a !important; color: #713f12; }
.n-u3 { grid-column: 5 / 8; background: #fef9c3 !important; color: #6b21a8; }
.n-u4 { grid-column: 8 / 10; background: #fef08a !important; color: #854d0e; }
.n-u5 { grid-column: 10 / 13; background: #ede9fe !important; color: #5b21b6; }

/* Middle row */
.n-m1 { grid-column: 1 / 3; background: #fdba74 !important; color: #7c2d12; display: flex; flex-direction: column; justify-content: center; }
.n-center {
  grid-column: 3 / 11;
  background: #faf8f2 !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 28px 16px !important;
  text-align: center;
}
.n-m2 { grid-column: 11 / 13; background: #fb923c !important; color: #7c2d12; display: flex; flex-direction: column; justify-content: center; }

.n-center-title {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #5b21b6;
  display: flex;
  align-items: center;
  gap: 12px;
}

.n-center-title .diamond {
  width: 12px;
  height: 12px;
  background: #7c3aed;
  transform: rotate(45deg);
  flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
}

.n-center-sub {
  font-size: 12px;
  color: #7c3aed;
  opacity: 0.75;
  font-weight: 400;
}

/* Bottom 5 cells */
.n-b1 { grid-column: 1 / 3; background: #bfdbfe !important; color: #1e3a8a; }
.n-b2 { grid-column: 3 / 5; background: #93c5fd !important; color: #1e3a8a; }
.n-b3 { grid-column: 5 / 8; background: #86efac !important; color: #14532d; }
.n-b4 { grid-column: 8 / 11; background: #4ade80 !important; color: #14532d; }
.n-b5 { grid-column: 11 / 13; background: #86efac !important; color: #14532d; }

/* Bottom strip */
.n-bot {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--border) !important;
  padding: 0 !important;
}

.n-bot > div {
  padding: 12px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.n-bot-1 { background: #ddd6fe; color: #4c1d95; }
.n-bot-2 { background: #c4b5fd; color: #4c1d95; }
.n-bot-3 { background: #22c55e; color: #052e16; }
.n-bot-4 { background: #16a34a; color: #052e16; }
.n-bot-5 { background: #15803d; color: #f0fdf4; }

.needs-cell {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-content: flex-start;
  align-items: baseline;
}

.needs-cell .schema-word.em {
  width: auto;
  margin-bottom: 2px;
}

.needs-cell .schema-word.sub {
  width: 100%;
  margin-bottom: 4px;
}

/* ---------- FEELINGS SCHEMA ---------- */

.feelings-schema {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.feel-banner {
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 16px;
  font-family: var(--mono);
}

.feel-banner.met {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  color: #fff;
}

.feel-banner.unmet {
  background: linear-gradient(90deg, #64748b, #475569);
  color: #fff;
}

.feel-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--border);
}

.feel-cell {
  padding: 16px 12px;
  min-height: 180px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-content: flex-start;
}

.feel-cell .schema-word {
  color: inherit;
}

.feel-cell .schema-word.em {
  font-size: 14px;
  line-height: 1.4;
}

.feel-m3 .schema-word.em {
  font-size: 15px;
  font-weight: 700;
}

/* Met feelings — greens */
.feel-m1 { background: #86efac; color: #14532d; }
.feel-m2 { background: #4ade80; color: #14532d; }
.feel-m3 { background: #bbf7d0; color: #166534; }
.feel-m4 { background: #86efac; color: #14532d; }
.feel-m5 { background: #4ade80; color: #14532d; }

/* Center band */
.feel-center {
  background: #fefce8;
  padding: 28px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
}

.feel-center-title {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #1e40af;
  display: flex;
  align-items: center;
  gap: 12px;
}

.feel-heart {
  width: 22px;
  height: 20px;
  position: relative;
  flex-shrink: 0;
}

.feel-heart::before,
.feel-heart::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 18px;
  background: #3b82f6;
  border-radius: 12px 12px 0 0;
  top: 0;
}

.feel-heart::before {
  left: 11px;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}

.feel-heart::after {
  left: 0;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
}

/* Unmet feelings — grays / browns */
.feel-u1 { background: #d1d5db; color: #1f2937; }
.feel-u2 { background: #9ca3af; color: #111827; }
.feel-u3 { background: #d6d3d1; color: #292524; }
.feel-u4 { background: #a8a29e; color: #1c1917; }
.feel-u5 { background: #6b7280; color: #f9fafb; }

/* ---------- ACTIONS SCHEMA ---------- */

.actions-schema {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.actions-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
}

.act-center {
  background: #ffffff;
  padding: 24px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
}

.act-center-title {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #d97706;
  display: flex;
  align-items: center;
  gap: 12px;
  text-transform: uppercase;
}

.act-emoji {
  font-size: 1.15em;
  display: inline-block;
}

.act-col {
  background: #fff;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Category column backgrounds matching the theme */
.act-c1 { background: #fde68a; color: #78350f; }
.act-c2 { background: #ede9fe; color: #5b21b6; }
.act-c3 { background: #dcfce7; color: #14532d; }
.act-c4 { background: #ffe4e6; color: #9f1239; }
.act-c5 { background: #ffedd5; color: #7c2d12; }
.act-c6 { background: #dbeafe; color: #1e3a8a; }

.act-col-header {
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  padding-bottom: 8px;
  margin-bottom: 2px;
}

.act-col-header h3 {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: inherit;
  margin-top: 2px;
}

.act-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.act-list .schema-word.em {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  color: inherit;
  opacity: 0.95;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 900px) {
  .needs-schema {
    grid-template-columns: 1fr 1fr;
  }

  .n-top { grid-column: 1 / -1; }
  .n-u1, .n-u2, .n-u3, .n-u4, .n-u5,
  .n-m1, .n-m2, .n-b1, .n-b2, .n-b3, .n-b4, .n-b5 {
    grid-column: auto;
  }
  .n-center { grid-column: 1 / -1; order: -1; }
  .n-bot {
    grid-column: 1 / -1;
    grid-template-columns: 1fr;
  }

  .feel-row {
    grid-template-columns: 1fr 1fr;
  }

  .feel-cell { min-height: 140px; }
}

@media (max-width: 1024px) {
  .actions-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 720px) {
  .modal { padding: 28px 10px; }
  .modal-close { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 24px; }
  .modal-body { padding: 0; }

  .feel-row { grid-template-columns: 1fr; }

  .needs-schema { grid-template-columns: 1fr; }

  .actions-row { grid-template-columns: 1fr; }

  .n-bot { grid-template-columns: 1fr; }

  .rings { --band: 17%; }
  .ring-label { font-size: 10px; letter-spacing: 0.06em; }
  .ring-label.needs { font-size: 11px; }
  .home-circumstances-label { top: 16px; font-size: 11px; }
}
</style>
</head>
<body>

<!-- HOME / SCHEMA BACKGROUND -->
<div id="home">
  <div class="home-wrap">
    <div class="home-circumstances-label">Обставини</div>

    <div class="rings" role="button" aria-label="Шари" onclick="handleRingsClick(event)">
      <div class="ring ring-actions" title="Дії в середовищі — стратегії"></div>
      <div class="ring-label actions">
        <span>Дії</span>
        <span class="ring-sub">стратегії</span>
      </div>

      <div class="ring ring-feelings" title="Почуття — сигнали про потреби"></div>
      <div class="ring-label feelings">
        <span>Почуття</span>
        <span class="ring-sub">сигнали про потреби</span>
      </div>

      <div class="ring ring-needs" title="Потреби — спільні для всіх">
        <div class="ring-needs-content">
          <span class="ring-main needs">Потреби</span>
          <span class="ring-sub needs">спільні для всіх</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SECTION TEMPLATES -->

<template id="tpl-needs">
  <div class="schema-wrap">
    <div class="needs-schema">

      <!-- Top bar: spiritual / meaning -->
      <div class="n-top">
        <span class="schema-word">Присутність</span>
        <span class="schema-word">Служіння</span>
        <span class="schema-word">Усвідомленість</span>
        <span class="schema-word">Реалізація</span>
        <span class="schema-word">Призначення</span>
        <span class="schema-word">Духовність</span>
        <span class="schema-word">Віра</span>
      </div>

      <!-- Upper row -->
      <div class="n-u1 needs-cell">
        <span class="schema-word em">Фізична безпека</span>
        <span class="schema-word em">Емоційна безпека</span>
        <span class="schema-word em">Здоров'я</span>
        <span class="schema-word em">Комфорт</span>
        <span class="schema-word em">Мир</span>
        <span class="schema-word em">Стабільність</span>
        <span class="schema-word">Впевненість у завтрашньому дні</span>
      </div>

      <div class="n-u2 needs-cell">
        <span class="schema-word em">Секс</span>
        <span class="schema-word sub">сексуальність</span>
        <span class="schema-word em">Чуттєвість</span>
        <span class="schema-word sub">Продовження роду</span>
        <span class="schema-word em">Насолода</span>
        <span class="schema-word em">Легкість</span>
        <span class="schema-word em">Дотик</span>
        <span class="schema-word em">Інтимність</span>
        <span class="schema-word em">Ніжність</span>
      </div>

      <div class="n-u3 needs-cell">
        <span class="schema-word em">Активність</span>
        <span class="schema-word em">Енергія</span>
        <span class="schema-word em">Життєва сила</span>
        <span class="schema-word em">Виклик</span>
        <span class="schema-word em">Пригоди</span>
        <span class="schema-word em">Новизна</span>
        <span class="schema-word em">Рух</span>
        <span class="schema-word em">Зміни</span>
        <span class="schema-word em">Гра</span>
        <span class="schema-word em">Веселощі</span>
      </div>

      <div class="n-u4 needs-cell">
        <span class="schema-word em">Розвиток</span>
        <span class="schema-word em">Сила</span>
        <span class="schema-word em">Вплив</span>
        <span class="schema-word em">Ефективність</span>
        <span class="schema-word em">Процвітання</span>
        <span class="schema-word em">Ціль</span>
      </div>

<!-- SINGLE APP LIGHTBOX OVERLAY -->
<div id="app-modal" class="modal" onclick="if(event.target===this) closeAppModal()">
  <button type="button" class="modal-close" onclick="closeAppModal()" aria-label="Закрити">&times;</button>
  <div class="modal-card">
    <div id="modal-body-content" class="modal-body"></div>
  </div>
</div>

<script>
const MODAL_DATA = {
  needs: { templateId: 'tpl-needs' },
  feelings: { templateId: 'tpl-feelings' },
  actions: { templateId: 'tpl-actions' }
};

function handleRingsClick(e) {
  const rings = document.querySelector('.rings');
  if (!rings) return;
  const rect = rings.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const dx = e.clientX - centerX;
  const dy = e.clientY - centerY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const radius = rect.width / 2;
  const ratio = dist / radius;

  if (ratio > 1.0) return;

  if (ratio <= 0.33) {
    openAppModal('needs');
  } else if (ratio <= 0.67) {
    openAppModal('feelings');
  } else {
    openAppModal('actions');
  }
}

function openAppModal(type) {
  const data = MODAL_DATA[type];
  if (!data) return;

  const modal = document.getElementById('app-modal');
  const bodyEl = document.getElementById('modal-body-content');
  const tpl = document.getElementById(data.templateId);

  if (!modal || !bodyEl || !tpl) return;

  bodyEl.innerHTML = '';
  bodyEl.appendChild(tpl.content.cloneNode(true));

  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeAppModal() {
  const modal = document.getElementById('app-modal');
  if (!modal) return;
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeAppModal();
  }
});
</script>
