<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-label="Схема: Що емпатія реально робить, а чого не робить">
  <defs>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.03"/>
    </filter>
  </defs>

  <style>
    .card-good { fill: #f5fbf7; stroke: #c6ecd4; stroke-width: 1.3; rx: 14px; filter: url(#card-shadow); }
    .card-warn { fill: #fff6f5; stroke: #f5cfca; stroke-width: 1.3; rx: 14px; filter: url(#card-shadow); }

    .title-good { font: 700 15.5px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #14532d; }
    .title-warn { font: 700 15.5px/1.2 Inter, -apple-system, system-ui, sans-serif; fill: #991b1b; }
    
    .sub-node { font: 400 12.5px/1.25 Inter, -apple-system, system-ui, sans-serif; fill: #4b5563; }

    .badge-pill-good { fill: #38a872; rx: 14px; }
    .badge-pill-warn { fill: #d97768; rx: 14px; }
    .badge-text { font: 700 11.5px/1 Inter, -apple-system, sans-serif; fill: #ffffff; letter-spacing: 0.8px; }

    .divider { stroke: #f0ece6; stroke-width: 1.2; stroke-dasharray: 6 6; }
  </style>

  <!-- Center divider -->
  <line class="divider" x1="450" y1="16" x2="450" y2="370"/>

  <!-- ================= LEFT COLUMN: ЩО РОБИТЬ (x: 35, width: 390, center: 230) ================= -->
  <!-- Column Header Badge (y: 14) -->
  <g transform="translate(125, 14)">
    <rect class="badge-pill-good" width="210" height="28"/>
    <text class="badge-text" x="105" y="18" text-anchor="middle">ЩО РЕАЛЬНО РОБИТЬ</text>
  </g>

  <!-- Item 1 (y: 58) -->
  <g transform="translate(35, 58)">
    <rect class="card-good" width="390" height="64"/>
    <text class="title-good" x="22" y="27">Глибина розуміння інших та себе</text>
    <text class="sub-node" x="22" y="47">живий людський досвід поруч із фактами та ролями</text>
  </g>

  <!-- Item 2 (y: 136) -->
  <g transform="translate(35, 136)">
    <rect class="card-good" width="390" height="64"/>
    <text class="title-good" x="22" y="27">Психологічна безпека</text>
    <text class="sub-node" x="22" y="47">стишує внутрішнього критика і знімає захист</text>
  </g>

  <!-- Item 3 (y: 214) -->
  <g transform="translate(35, 214)">
    <rect class="card-good" width="390" height="64"/>
    <text class="title-good" x="22" y="27">Довіра і контакт</text>
    <text class="sub-node" x="22" y="47">взаємне визнання без злиття та втрати власних меж</text>
  </g>

  <!-- Item 4 (y: 292) -->
  <g transform="translate(35, 292)">
    <rect class="card-good" width="390" height="64"/>
    <text class="title-good" x="22" y="27">Ресурс для дій</text>
    <text class="sub-node" x="22" y="47">опора на реальний стан і простір для вибору</text>
  </g>

  <!-- ================= RIGHT COLUMN: ЧОГО НЕ РОБИТЬ (x: 475, width: 390, center: 670) ================= -->
  <!-- Column Header Badge (y: 14) -->
  <g transform="translate(565, 14)">
    <rect class="badge-pill-warn" width="210" height="28"/>
    <text class="badge-text" x="105" y="18" text-anchor="middle">ЧОГО НЕ РОБИТЬ</text>
  </g>

  <!-- Item 1 (y: 58) -->
  <g transform="translate(475, 58)">
    <rect class="card-warn" width="390" height="64"/>
    <text class="title-warn" x="22" y="27">Не лікує гострі розлади</text>
    <text class="sub-node" x="22" y="47">при клінічних станах потрібна комплексна допомога</text>
  </g>

  <!-- Item 2 (y: 136) -->
  <g transform="translate(475, 136)">
    <rect class="card-warn" width="390" height="64"/>
    <text class="title-warn" x="22" y="27">Не замінює безпеку</text>
    <text class="sub-node" x="22" y="47">при загрозі насильства пріоритет — захист і дистанція</text>
  </g>

  <!-- Item 3 (y: 214) -->
  <g transform="translate(475, 214)">
    <rect class="card-warn" width="390" height="64"/>
    <text class="title-warn" x="22" y="27">Не скасовує правил і законів</text>
    <text class="sub-node" x="22" y="47">системні та геополітичні конфлікти вимагають угод</text>
  </g>

  <!-- Item 4 (y: 292) -->
  <g transform="translate(475, 292)">
    <rect class="card-warn" width="390" height="64"/>
    <text class="title-warn" x="22" y="27">Не дорівнює догоджанню</text>
    <text class="sub-node" x="22" y="47">розуміння іншого не вимагає відмови від себе</text>
  </g>
</svg>